name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: pipboy-windows-x64
          path: |
            target/release/pipboy.exe
            config.toml
            vault/CLAUDE.md

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pipboy-windows-x64
          path: dist
      - run: |
          Move-Item dist/target/release/pipboy.exe dist/pipboy.exe
          Remove-Item -Recurse -Force dist/target
          Compress-Archive -Path dist/* -DestinationPath pipboy-windows-x64.zip
        shell: pwsh
      - uses: softprops/action-gh-release@v2
        with:
          files: pipboy-windows-x64.zip
