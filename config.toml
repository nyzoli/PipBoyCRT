[net]
targets = ["gateway", "1.1.1.1", "8.8.8.8"]
speedtest_history = 20

[clock]
zones = ["America/New_York", "Asia/Tokyo"]
timer_minutes = 25
view = "normal"   # starting view: "normal" / "digital" / "analog" (`v` cycles them)

# RSS/Atom feed URLs next to the built-in Hacker News front page; limit = items per source
[news]
feeds = [
    "https://www.nasa.gov/feed/",
    "https://feeds.arstechnica.com/arstechnica/index",
    "https://www.theverge.com/rss/index.xml",
]
limit = 30

# Markdown note file next to the executable (created on the first save)
[notes]
file = "notes.md"

# Seconds between Wi-Fi scans (minimum 5; `r` scans right away)
[wifi]
interval = 15

# Embedded terminal: a PowerShell prompt by default; type `claude` in it (or set
# command = "claude") to talk to Claude Code from the vault. The command is looked
# up on the PATH as <command>.exe/.cmd/.bat (an absolute path is used as is);
# cwd is relative to the executable
[term]
command = "pwsh"
args = []
cwd = "vault"
release_key = "f12"
scrollback = 1000

# ART holotape gallery: ANSI art from 16colo.rs and streamed ascii.live
# animations. `animations` are ascii.live names (https://ascii.live/<name>);
# nothing is written to disk, every picture lives in memory only
[art]
animations = ["parrot", "nyan", "donut", "dvd", "batman", "forrest", "knot", "coin", "playstation", "spidyswing"]

# MUSIC: folder browser over a local library; one directory level is read at a
# time, so a big tree on a network share is fine
[music]
dir = "music"
shuffle = false

# MAIL: read-only inbox through the Himalaya CLI (install it, then run
# `himalaya configure` once). interval is in seconds, minimum 30
[mail]
command = "himalaya"
account = ""          # empty = Himalaya's default account
mailbox = "INBOX"
interval = 300
page_size = 30

# SYSLOG: recent Windows event-log errors and warnings (System + Application),
# read with one fixed Get-WinEvent PowerShell call. interval is in seconds,
# minimum 60
[syslog]
hours = 24          # look back this many hours (1-168)
max = 200           # most events per refresh (10-500)
interval = 300
levels = "warn"     # "error" = critical + error only, "warn" = with warnings

# WASTELAND: the devices on the local network, from the Windows IPv4 neighbour
# (ARP) table. interval is in seconds, minimum 20. The sweep pings every address
# of the subnet (254 max) on the first scan and every fifth one after that, so
# silent devices enter the ARP table — it is visible to anything watching the
# network, so set sweep = false to keep the tab passive (`s` toggles it for the
# session). Names are remembered in wasteland.json next to the executable.
[wasteland]
interval = 60
sweep = true
subnet = ""         # e.g. "192.168.100.0/24"; empty = the gateway's /24

# Screen time as a radiation dose: after `work` minutes on the keyboard the dose
# is critical and a `rest`-minute break is prescribed. A gap of `idle` minutes
# (or a locked workstation) closes the session; sessions and completed breaks
# are appended to dosimeter.log next to the executable.
[dosimeter]
work = 45
rest = 15
idle = 3
quiet = ["22:00-07:00"]   # no Geiger burst inside these windows
watch_foreground = false  # per-app minutes today (memory only, never logged)
rest_apps = ["vlc", "mpv"]  # foreground apps that count as rest even with input
history = 30              # days of log kept for the 7-day sparkline
